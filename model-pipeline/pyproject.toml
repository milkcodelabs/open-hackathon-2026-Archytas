[project]
name = "voicetotext-models"
version = "0.1.0"
description = "Model pipeline of the Greek voice-to-text app: Omnilingual acoustic export, n-gram language model, spelling index, GPT-2 rescorer, evaluation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "onnxruntime>=1.18",
    "pydantic>=2.7",
    "typer>=0.12",
    "pyyaml>=6.0",
    "soundfile>=0.12",
]

[project.optional-dependencies]
# Beam search used for evaluation and alpha/beta tuning. pyctcdecode pins numpy<2, so this
# extra needs a Python that still has numpy 1.x wheels (3.11 / 3.12).
decode = ["pyctcdecode>=0.5.0", "numpy<2"]
# KenLM python bindings (perplexity, pyctcdecode's LM), built from source (needs build-essential + boost).
lm = ["kenlm>=0.2.0", "pyarrow>=15"]
# ONNX graph editing: the Omnilingual phone graph and the GPT-2 int8 export.
export = ["onnx>=1.16"]
# Greek GPT-2 export and the probe that checks the app's tokenizer.
neural = ["torch>=2.4", "transformers>=4.44"]
# Downloading FLEURS and decoding Common Voice mp3s (resampling to 16 kHz).
data = ["huggingface-hub>=0.24", "torch>=2.4", "torchaudio>=2.4"]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
voicetotext = "voicetotext.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voicetotext"]

[tool.uv]
index = [
    { name = "pytorch-cpu", url = "https://download.pytorch.org/whl/cpu", explicit = true },
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
